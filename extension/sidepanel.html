<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kloud Koach — Live Co-Pilot</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8f9fa;
        color: #1a1a1a;
      }
      header {
        background: linear-gradient(90deg, #4a148c 0%, #7b1fa2 100%);
        color: white;
        padding: 12px 16px;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
      }
      #setup {
        padding: 16px;
      }
      #setup input {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ddd;
        margin-bottom: 10px;
        font-size: 13px;
      }
      #styleToggle {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      #styleToggle button {
        flex: 1;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: white;
        color: #444;
        font-size: 12px;
        cursor: pointer;
      }
      #styleToggle button.active {
        border-color: #7b1fa2;
        background: rgba(123, 31, 162, 0.08);
        color: #7b1fa2;
        font-weight: 600;
      }
      #setup button,
      #controls button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        background: linear-gradient(90deg, #7b1fa2 0%, #ad1457 100%);
        color: white;
      }
      #controls {
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #controls button {
        width: auto;
        flex: 1;
      }
      #statusChip {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 12px;
        background: #eee;
        white-space: nowrap;
      }
      #feed {
        padding: 0 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .turn {
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 14px;
        padding: 12px 14px;
      }
      .turn.latest {
        border-color: #7b1fa2;
        box-shadow: 0 2px 10px rgba(123, 31, 162, 0.15);
      }
      .turn .a {
        font-size: 14px;
        line-height: 1.5;
        color: #4a0072;
        white-space: pre-wrap;
      }
      #errorBanner {
        display: none;
        background: #fdecea;
        color: #b71c1c;
        padding: 8px 16px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header><h1>Kloud Koach Live Co-Pilot</h1></header>
    <div id="errorBanner"></div>

    <div id="setup">
      <input id="jobRoleInput" placeholder="Job role (e.g. Senior Frontend Engineer)" />
      <div id="styleToggle">
        <button type="button" id="styleProseBtn" class="active">Normal text</button>
        <button type="button" id="styleBulletsBtn">Bullet points</button>
      </div>
      <button id="startBtn">Start Listening</button>
    </div>

    <div id="controls" style="display: none">
      <span id="statusChip">idle</span>
      <button id="stopBtn">Stop</button>
    </div>

    <div id="phoneLinkRow" style="display: none; padding: 0 16px 8px">
      <button id="phoneLinkBtn" style="background: rgba(123, 31, 162, 0.08); color: #7b1fa2">
        Copy phone companion link
      </button>
    </div>

    <div id="feed"></div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
